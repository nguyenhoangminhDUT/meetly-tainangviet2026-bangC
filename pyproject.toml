[project]
name = "meetly-vkv-bangc"
version = "0.1.0"
description = "Meetly solution for AI Tai Nang Viet 2026 Bang C (Excel TableQA)"
readme = "README.md"
authors = [
    { name = "dientruonggg", email = "dientruong2104@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
meetly-vkv-bangc = "src.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
